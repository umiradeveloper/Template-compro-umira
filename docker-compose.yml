# Menjalankan Umira CMS (MySQL + backend NestJS + admin panel) dengan Docker.
#   docker compose up -d --build
#   docker compose exec backend node dist/database/seeds/run-seed.js      # isi data awal
# Admin panel: http://localhost:5173   API: http://localhost:4000/api   Swagger: http://localhost:4000/api/docs
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: umira_cms
      MYSQL_USER: umira
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-umira123}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3005}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: umira
      DB_PASSWORD: ${MYSQL_PASSWORD:-umira123}
      DB_DATABASE: umira_cms
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di file .env}
      JWT_EXPIRES_IN: 1d
      UPLOAD_DIR: uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@umiraglobal.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_CONTENT_DIR: /website
    volumes:
      - uploads:/app/uploads
      # konten website lama untuk diimpor seeder (read-only)
      - ./frontend/website:/website:ro
    ports:
      - "4000:4000"

  admin:
    build:
      context: ./frontend/admin
      args:
        VITE_API_URL: ${APP_URL:-http://localhost:4000}
        VITE_SITE_URL: ${SITE_URL:-http://localhost:3005}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
  uploads:
